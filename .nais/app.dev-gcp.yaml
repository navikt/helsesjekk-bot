spec:
  ingresses:
    - 'https://helsesjekk-bot.intern.dev.nav.no'

  replicas:
    min: 1
    max: 2

  gcp:
    sqlInstances:
      - type: POSTGRES_16
        databases:
          - name: helsesjekk-bot
        tier: db-f1-micro

  azure:
    application:
      allowAllUsers: true
      tenant: trygdeetaten.no

  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 5m
      memory: 256Mi
