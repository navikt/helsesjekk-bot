spec:
  ingresses:
    - 'https://helsesjekk-bot.intern.nav.no'
    - 'https://helsesjekk-bot.nav.no'

  replicas:
    min: 2
    max: 3
    scalingStrategy:
      cpu:
        thresholdPercentage: 90

  gcp:
    sqlInstances:
      - type: POSTGRES_16
        databases:
          - name: helsesjekk-bot
        tier: db-custom-1-3840

  azure:
    application:
      allowAllUsers: true
      tenant: nav.no

  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 90m
      memory: 650Mi
