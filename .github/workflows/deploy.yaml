name: Build and deploy
on: push

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  test-and-lint:
    name: 'Run tests and lint'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: navikt/tsm-workflows/actions/yarn@main
        with:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: yarn next typegen
      - run: yarn lint
      - run: yarn tsc
      - run: yarn test

  build-for-dependabot:
    if: github.actor == 'dependabot[bot]'
    name: 'Build for dependabot'
    runs-on: ubuntu-latest
    needs: test-and-lint
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: navikt/tsm-workflows/actions/yarn@main
        with:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: yarn build
        env:
          NEXT_PUBLIC_ENVIRONMENT: dev

  build-dev:
    name: Build for dev
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: navikt/tsm-workflows/actions/next/build@main
        id: next-build
        with:
          app: helsesjekk-bot
          team: 'teamsykmelding'
          env: dev
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          salsa: false
    outputs:
      image: ${{ steps.next-build.outputs.image }}

  build-prod:
    if: github.ref_name == 'main'
    name: Build for prod
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: navikt/tsm-workflows/actions/next/build@main
        id: next-build
        with:
          app: helsesjekk-bot
          team: 'teamsykmelding'
          env: prod
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          salsa: false
    outputs:
      image: ${{ steps.next-build.outputs.image }}

  sbom-dev:
    name: Upload SBOM for dev build
    needs: build-dev
    runs-on: ubuntu-26.04
    steps:
      - uses: navikt/tsm-workflows/actions/attest-sign@main
        with:
          image_ref: ${{ needs.build-dev.outputs.image }}
          team: teamsykmelding

  sbom-prod:
    name: Upload SBOM for prod build
    needs: build-prod
    runs-on: ubuntu-26.04
    steps:
      - uses: navikt/tsm-workflows/actions/attest-sign@main
        with:
          image_ref: ${{ needs.build-prod.outputs.image }}
          team: teamsykmelding

  deploy-dev:
    name: Deploy main to dev
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'dev/')
    environment:
      name: development
      url: https://helsesjekk-bot.intern.dev.nav.no
    runs-on: ubuntu-26.04
    needs: [build-dev]
    steps:
      - uses: actions/checkout@v7
      - uses: nais/setup@v1
        with:
          team: teamsykmelding
          environment: dev-gcp
      - name: deploy to dev-gcp
        run: |
          # nais apply .nais/nais-postgres.yaml --wait
          nais apply .nais/app.yaml --set spec.image="${{ needs.build-dev.outputs.image }}" --wait

  deploy-production:
    name: Deploy production
    if: github.ref_name == 'main'
    environment:
      name: production
      url: https://helsesjekk-bot.nav.no
    runs-on: ubuntu-26.04
    needs: [build-prod, test-and-lint]
    steps:
      - uses: actions/checkout@v7
      - uses: nais/setup@v1
        with:
          team: teamsykmelding
          environment: prod-gcp
      - name: deploy to prod-gcp
        run: |
          # nais apply .nais/nais-postgres.yaml --wait
          nais apply .nais/app.yaml --set spec.image="${{ needs.build-prod.outputs.image }}" --wait

  security:
    name: Security
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      security-events: write
    needs: build-prod
    uses: navikt/tsm-workflows/.github/workflows/security.yaml@main
    with:
      team: 'teamsykmelding'
      image: ${{ needs.build-prod.outputs.image }}
